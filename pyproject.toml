[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sir-leapfrog"
version = "1.1.0"
description = "Leap-frog integration of the classical SIR epidemic model"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
keywords = ["SIR", "epidemiology", "ODE", "leapfrog", "numerical-methods"]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/juandapradam12/Leap-Frog-Method-For-Solving-Ordinary-Differential-Equations-Describing-Epidemic-SIR-Model"

[tool.setuptools.packages.find]
include = ["sir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
